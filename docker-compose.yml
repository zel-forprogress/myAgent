services:
  postgres:
    image: postgres:16
    container_name: rag-postgres
    environment:
      POSTGRES_DB: myagent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d myagent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: rag-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: rag-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd_data:/etcd

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: rag-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/minio_data

  milvus:
    image: milvusdb/milvus:v2.5.4
    container_name: rag-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      - etcd
      - minio

  docling:
    image: quay.io/docling-project/docling-serve:latest
    container_name: rag-docling
    ports:
      - "5001:5001"
    environment:
      DOCLING_SERVE_ENABLE_UI: "1"
      DOCLING_SERVE_MAX_SYNC_WAIT: "600"

  backend:
    build:
      context: ./rag-backend
    container_name: rag-backend
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      CHAT_MODEL: ${CHAT_MODEL:-qwen3.7-plus}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v4}
      MILVUS_URI: http://milvus:19530
      MILVUS_COLLECTION: ${MILVUS_COLLECTION:-rag_docs}
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/myagent
      OBJECT_STORAGE_ENABLED: ${OBJECT_STORAGE_ENABLED:-true}
      OBJECT_STORAGE_PROVIDER: ${OBJECT_STORAGE_PROVIDER:-s3}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-myagent-docs}
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_USE_SSL: ${S3_USE_SSL:-false}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-dev-secret-key-change-me-please-use-32chars}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      AUTH_ACCESS_TOKEN_EXPIRE_MINUTES: ${AUTH_ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin123456}
      SEED_USER_USERNAME: ${SEED_USER_USERNAME:-demo}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-demo123456}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
      LANGFUSE_TIMEOUT: ${LANGFUSE_TIMEOUT:-30}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      INGESTION_TASK_MAX_RETRIES: ${INGESTION_TASK_MAX_RETRIES:-3}
      INGESTION_TASK_RETRY_DELAY_SECONDS: ${INGESTION_TASK_RETRY_DELAY_SECONDS:-30}
      RERANK_ENABLED: ${RERANK_ENABLED:-false}
      RERANK_MODEL: ${RERANK_MODEL:-qwen3-rerank}
      RERANK_BASE_URL: ${RERANK_BASE_URL:-}
      RERANK_TIMEOUT_SECONDS: ${RERANK_TIMEOUT_SECONDS:-30}
      RERANK_CANDIDATE_MULTIPLIER: ${RERANK_CANDIDATE_MULTIPLIER:-4}
      DOCUMENT_PARSER: ${DOCUMENT_PARSER:-docling}
      AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT: ${AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT:-}
      AZURE_DOCUMENT_INTELLIGENCE_KEY: ${AZURE_DOCUMENT_INTELLIGENCE_KEY:-}
      AZURE_DOCUMENT_INTELLIGENCE_MODEL: ${AZURE_DOCUMENT_INTELLIGENCE_MODEL:-prebuilt-layout}
      AZURE_DOCUMENT_INTELLIGENCE_TIMEOUT_SECONDS: ${AZURE_DOCUMENT_INTELLIGENCE_TIMEOUT_SECONDS:-120}
      DOCLING_BASE_URL: ${DOCLING_BASE_URL:-http://docling:5001}
      DOCLING_API_KEY: ${DOCLING_API_KEY:-}
      DOCLING_TIMEOUT_SECONDS: ${DOCLING_TIMEOUT_SECONDS:-600}
      DOCLING_DO_OCR: ${DOCLING_DO_OCR:-true}
      DOCLING_FORCE_OCR: ${DOCLING_FORCE_OCR:-false}
      DOCLING_TABLE_MODE: ${DOCLING_TABLE_MODE:-accurate}
      DOCLING_OCR_LANGS: ${DOCLING_OCR_LANGS:-en,ch_sim}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_started
      minio:
        condition: service_started
      docling:
        condition: service_started

  worker:
    build:
      context: ./rag-backend
    container_name: rag-worker
    command: celery -A app.core.celery_app.celery_app worker -Q ingestion --loglevel=INFO
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      CHAT_MODEL: ${CHAT_MODEL:-qwen3.7-plus}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v4}
      MILVUS_URI: http://milvus:19530
      MILVUS_COLLECTION: ${MILVUS_COLLECTION:-rag_docs}
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/myagent
      OBJECT_STORAGE_ENABLED: ${OBJECT_STORAGE_ENABLED:-true}
      OBJECT_STORAGE_PROVIDER: ${OBJECT_STORAGE_PROVIDER:-s3}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-myagent-docs}
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_USE_SSL: ${S3_USE_SSL:-false}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-dev-secret-key-change-me-please-use-32chars}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
      LANGFUSE_TIMEOUT: ${LANGFUSE_TIMEOUT:-30}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      INGESTION_TASK_MAX_RETRIES: ${INGESTION_TASK_MAX_RETRIES:-3}
      INGESTION_TASK_RETRY_DELAY_SECONDS: ${INGESTION_TASK_RETRY_DELAY_SECONDS:-30}
      RERANK_ENABLED: ${RERANK_ENABLED:-false}
      RERANK_MODEL: ${RERANK_MODEL:-qwen3-rerank}
      RERANK_BASE_URL: ${RERANK_BASE_URL:-}
      RERANK_TIMEOUT_SECONDS: ${RERANK_TIMEOUT_SECONDS:-30}
      RERANK_CANDIDATE_MULTIPLIER: ${RERANK_CANDIDATE_MULTIPLIER:-4}
      DOCUMENT_PARSER: ${DOCUMENT_PARSER:-docling}
      AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT: ${AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT:-}
      AZURE_DOCUMENT_INTELLIGENCE_KEY: ${AZURE_DOCUMENT_INTELLIGENCE_KEY:-}
      AZURE_DOCUMENT_INTELLIGENCE_MODEL: ${AZURE_DOCUMENT_INTELLIGENCE_MODEL:-prebuilt-layout}
      AZURE_DOCUMENT_INTELLIGENCE_TIMEOUT_SECONDS: ${AZURE_DOCUMENT_INTELLIGENCE_TIMEOUT_SECONDS:-120}
      DOCLING_BASE_URL: ${DOCLING_BASE_URL:-http://docling:5001}
      DOCLING_API_KEY: ${DOCLING_API_KEY:-}
      DOCLING_TIMEOUT_SECONDS: ${DOCLING_TIMEOUT_SECONDS:-600}
      DOCLING_DO_OCR: ${DOCLING_DO_OCR:-true}
      DOCLING_FORCE_OCR: ${DOCLING_FORCE_OCR:-false}
      DOCLING_TABLE_MODE: ${DOCLING_TABLE_MODE:-accurate}
      DOCLING_OCR_LANGS: ${DOCLING_OCR_LANGS:-en,ch_sim}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_started
      minio:
        condition: service_started
      docling:
        condition: service_started

  frontend:
    build:
      context: ./rag-frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    container_name: rag-frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  etcd_data:
  minio_data:
  milvus_data:
  redis_data:
